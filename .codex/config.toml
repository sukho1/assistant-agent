# Codex 版项目级配置
# 对应 Claude 版 `.claude/settings.local.json` 中的项目运行偏好。
# 注意：`.codex/config.toml` 仅在项目被标记为 trusted 时加载。

# 默认在 workspace-write 沙箱中运行；只读工作区外的写入需另行审批。
sandbox_mode = "workspace-write"

# 需要升级权限、离开沙箱、或可能产生外部副作用时由 Codex 主动询问。
approval_policy = "on-request"

# Codex 不保证读取 Claude 的 .mcp.json，这里显式注册 diary-rag MCP。
# 入口用 cmd 直启 venv Python。握手必须快：客户端在会话开始约 15 秒后冻结
# 工具集，来不及连接的服务器会被静默丢弃，且整个会话不再补录。
[mcp_servers.diary-rag]
command = "cmd"
args = ["/d", "/c", "program\\diary_rag\\run_mcp.cmd"]
startup_timeout_sec = 120

[mcp_servers.diary-rag.env]
HF_HUB_OFFLINE = "1"
TQDM_DISABLE = "1"
PYTHONIOENCODING = "utf-8"
